name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The refresh workflow keeps the newest snapshot on its own branch. Until
      # it has run once, the snapshot committed on main is what gets deployed.
      - name: Use the newest snapshot
        run: |
          if git ls-remote --exit-code --heads origin snapshot > /dev/null; then
            git fetch --depth=1 origin snapshot
            rm -f public/data/*
            git archive FETCH_HEAD | tar -x -C public/data
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
