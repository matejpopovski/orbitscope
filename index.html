<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Every active satellite on a WebGL globe, propagated in your browser with a hand-written SGP4."
    />
    <title>orbitscope</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%235ad1ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%235ad1ff' stroke-width='1.6' transform='rotate(-28 16 16)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="view" aria-label="Globe showing the position of every tracked satellite"></canvas>
    <div id="overlay" aria-hidden="true"></div>

    <header id="brand">
      <h1>ORBITSCOPE</h1>
      <div id="utc" aria-live="off">----</div>
    </header>

    <aside id="catalog" class="panel" aria-label="Catalog">
      <h2>Catalog</h2>
      <div class="total">
        <span id="total-count">0</span><span class="unit">objects tracked</span>
      </div>
      <div id="synthetic" class="warning" hidden></div>
      <ul id="categories"></ul>
      <label class="field" for="search">
        <span>Find</span>
        <input
          id="search"
          type="search"
          placeholder="name, NORAD or COSPAR ID"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <ul id="results"></ul>
    </aside>

    <aside id="track" class="panel" aria-label="Selected satellite" hidden>
      <div class="track-head">
        <div>
          <h2 id="track-name"></h2>
          <div id="track-ids" class="dim"></div>
        </div>
        <button id="track-close" class="icon" type="button" aria-label="Clear selection">
          &times;
        </button>
      </div>
      <dl id="telemetry"></dl>

      <h3>Observer</h3>
      <div class="observer">
        <label class="field"
          ><span>Lat</span><input id="obs-lat" type="number" step="0.01" min="-90" max="90"
        /></label>
        <label class="field"
          ><span>Lon</span><input id="obs-lon" type="number" step="0.01" min="-180" max="180"
        /></label>
        <label class="field"
          ><span>Mask&deg;</span><input id="obs-mask" type="number" step="1" min="0" max="80"
        /></label>
        <button id="obs-locate" type="button">Locate</button>
      </div>
      <div id="look" class="dim"></div>

      <h3>Next passes <span id="pass-horizon" class="dim"></span></h3>
      <table id="passes">
        <thead>
          <tr>
            <th scope="col">Rise (UTC)</th>
            <th scope="col">Max</th>
            <th scope="col">Dur</th>
            <th scope="col">Vis</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="pass-status" class="dim"></div>
    </aside>

    <section id="timebar" aria-label="Time controls">
      <button id="time-now" type="button">Now</button>
      <div id="rates" role="group" aria-label="Time rate"></div>
    </section>

    <section id="perf" aria-label="Performance"></section>

    <footer id="credits">
      <span id="data-credit"></span>
      <span
        >Imagery: NASA Earth Observatory, Blue Marble Next Generation and Black Marble 2016.</span
      >
    </footer>

    <div id="status" role="status">Loading catalog</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
